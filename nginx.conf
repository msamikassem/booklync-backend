# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy configuration
# File location on your VPS: /etc/nginx/sites-available/booking_platform
#
# SETUP STEPS ON YOUR VPS:
# 1. Install nginx:          sudo apt install nginx
# 2. Copy this file:         sudo cp nginx.conf /etc/nginx/sites-available/booking_platform
# 3. Enable it:              sudo ln -s /etc/nginx/sites-available/booking_platform /etc/nginx/sites-enabled/
# 4. Install certbot:        sudo apt install certbot python3-certbot-nginx
# 5. Get SSL certificate:    sudo certbot --nginx -d api.yourdomain.com
# 6. Test config:            sudo nginx -t
# 7. Reload nginx:           sudo systemctl reload nginx
#
# Replace api.yourdomain.com with your actual domain throughout this file.
# ─────────────────────────────────────────────────────────────────────────────

# Rate limiting zone — limits each IP to 20 requests/second
# This prevents abuse and basic DDoS attacks
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.yourdomain.com;

    # ── SSL certificates (managed by Certbot) ─────────────────────────────
    # Certbot will fill these in automatically when you run it
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # ── SSL hardening ─────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Request size limit ────────────────────────────────────────────────
    # Prevents large payload attacks. Increase if you accept file uploads.
    client_max_body_size 10M;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1000;

    # ── Proxy to FastAPI (Uvicorn) ────────────────────────────────────────
    location / {
        # Apply rate limiting — allows brief bursts up to 50 requests
        limit_req zone=api_limit burst=50 nodelay;

        # Forward the request to Uvicorn running on port 8000
        proxy_pass http://127.0.0.1:8000;

        # Required proxy headers so FastAPI sees the real client IP and protocol
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — increase if you have long-running AI responses
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Twilio webhooks get a separate, more lenient rate limit ───────────
    # Twilio can send multiple webhook calls in quick succession
    location /api/v1/twilio/ {
        limit_req zone=api_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Health check — no rate limiting ───────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        access_log off;    # don't log health check hits — they're noisy
    }

    # ── Block common attack paths ─────────────────────────────────────────
    location ~ /\. {
        deny all;    # block .env, .git, .htaccess etc.
    }
}
